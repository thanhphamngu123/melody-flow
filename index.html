<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelodyFlow - YouTube Music Player</title>
    <meta name="description" content="Beautiful YouTube music player. Add your favorite songs and create playlists.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="10" stroke="#10b981" stroke-width="2"/>
                        <circle cx="12" cy="12" r="3" fill="#10b981"/>
                        <path d="M12 2a10 10 0 0 1 0 20" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
                    </svg>
                </div>
                <span class="logo-text">MelodyFlow</span>
            </div>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-section-header">
                <span class="sidebar-label">Your Library</span>
                <button class="icon-btn new-playlist-btn" id="newPlaylistBtn" title="New Playlist">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </button>
            </div>
            <div class="playlist-list" id="playlistList"></div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <!-- Welcome State -->
        <div class="welcome-state" id="welcomeState">
            <div class="welcome-icon">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="10" stroke="#10b981" stroke-width="1.5" opacity="0.3"/>
                    <path d="M9 18V5l12-2v13" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="6" cy="18" r="3" stroke="#10b981" stroke-width="1.5"/>
                    <circle cx="18" cy="16" r="3" stroke="#10b981" stroke-width="1.5"/>
                </svg>
            </div>
            <h2>Welcome to MelodyFlow</h2>
            <p>Create a playlist to start listening</p>
            <button class="primary-btn" id="welcomeCreateBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                Create Playlist
            </button>
        </div>

        <!-- Playlist View -->
        <div class="playlist-view" id="playlistView" style="display:none;">
            <div class="playlist-header">
                <div class="playlist-header-info">
                    <h1 id="playlistTitle">My Playlist</h1>
                    <span class="song-count" id="songCount">0 songs</span>
                </div>
                <div class="playlist-header-actions">
                    <button class="icon-btn" id="renamePlaylistBtn" title="Rename">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                    </button>
                    <button class="icon-btn danger" id="deletePlaylistBtn" title="Delete Playlist">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="add-song-bar">
                <div class="add-song-input-wrapper">
                    <svg class="add-song-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                    </svg>
                    <input type="text" id="songUrlInput" placeholder="Paste YouTube link here..." autocomplete="off">
                    <button class="add-song-btn" id="addSongBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        Add
                    </button>
                </div>
            </div>

            <div class="song-list" id="songList"></div>

            <div class="empty-playlist-state" id="emptyPlaylistState" style="display:none;">
                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" opacity="0.3">
                    <path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="1.5"/>
                </svg>
                <h3>Playlist is empty</h3>
                <p>Paste a YouTube link above to add your first song</p>
            </div>
        </div>
    </main>

    <!-- Player Bar -->
    <div class="player-bar" id="playerBar">
        <div class="player-section player-song-info">
            <div class="player-thumbnail-wrapper" id="playerThumbnailWrapper">
                <img id="playerThumbnail" src="" alt="" class="player-thumbnail">
                <div class="player-thumbnail-placeholder">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3">
                        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
                    </svg>
                </div>
            </div>
            <div class="player-song-details">
                <span class="player-song-title" id="playerSongTitle">No song playing</span>
                <span class="player-playlist-name" id="playerPlaylistName"></span>
            </div>
        </div>

        <div class="player-section player-controls-section">
            <div class="player-controls">
                <button class="control-btn" id="shuffleBtn" title="Shuffle">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
                        <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
                        <line x1="4" y1="4" x2="9" y2="9"/>
                    </svg>
                </button>
                <button class="control-btn" id="prevBtn" title="Previous">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                    </svg>
                </button>
                <button class="control-btn play-pause-btn" id="playPauseBtn" title="Play">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" id="playIcon">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" id="pauseIcon" style="display:none;">
                        <path d="M6 4h4v16H6zM14 4h4v16h-4z"/>
                    </svg>
                </button>
                <button class="control-btn" id="nextBtn" title="Next">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                    </svg>
                </button>
                <button class="control-btn" id="repeatBtn" title="Repeat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                        <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                    </svg>
                    <span class="repeat-badge" id="repeatBadge" style="display:none;">1</span>
                </button>
            </div>
            <div class="player-progress">
                <span class="time-label" id="currentTime">0:00</span>
                <div class="progress-bar-wrapper" id="progressBarWrapper">
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="progressBarFill"></div>
                        <div class="progress-bar-handle" id="progressBarHandle"></div>
                    </div>
                </div>
                <span class="time-label" id="totalTime">0:00</span>
            </div>
        </div>

            <button class="control-btn btn-8d" id="btn8D" title="Toggle 8D Audio Mode (Best with Headphones)">
                <span class="btn-8d-text">8D</span>
            </button>
            <button class="control-btn" id="volumeBtn" title="Volume">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="volumeIcon">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14" id="volumeWave1"/>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07" id="volumeWave2"/>
                </svg>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="volumeMuteIcon" style="display:none;">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
                </svg>
            </button>
            <div class="volume-slider-wrapper">
                <div class="volume-bar-wrapper" id="volumeBarWrapper">
                    <div class="volume-bar-bg">
                        <div class="volume-bar-fill" id="volumeBarFill" style="width:80%"></div>
                        <div class="volume-bar-handle" id="volumeBarHandle" style="left:80%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden YouTube Player & 8D Audio Element -->
    <div id="ytPlayerContainer" style="position:fixed;top:-9999px;left:-9999px;width:320px;height:180px;pointer-events:none;opacity:0;">
        <div id="ytPlayer"></div>
    </div>
    <audio id="audio8D" crossorigin="anonymous" style="display:none;"></audio>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 class="modal-title" id="modalTitle">New Playlist</h3>
            <input type="text" class="modal-input" id="modalInput" placeholder="Playlist name..." autocomplete="off">
            <div class="modal-actions">
                <button class="modal-btn cancel" id="modalCancel">Cancel</button>
                <button class="modal-btn confirm" id="modalConfirm">Create</button>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div class="modal-overlay" id="confirmOverlay">
        <div class="modal">
            <h3 class="modal-title" id="confirmTitle">Confirm</h3>
            <p class="modal-message" id="confirmMessage"></p>
            <div class="modal-actions">
                <button class="modal-btn cancel" id="confirmCancel">Cancel</button>
                <button class="modal-btn confirm danger" id="confirmOk">Delete</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
